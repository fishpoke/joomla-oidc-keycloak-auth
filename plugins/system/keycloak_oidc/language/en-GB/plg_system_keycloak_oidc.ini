PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_DEBUG_LABEL="Debug logging"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_DEBUG_DESC="Enable debug logging for the Keycloak OIDC plugin."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_USAGE_NOTICE_LABEL="Usage notes"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_USAGE_NOTICE_DESC="Backend login link (example):<br><code>https://joomla.lokal/administrator/index.php?option=com_ajax&amp;plugin=keycloak_oidc&amp;format=raw&amp;task=login</code><br><br>Frontend login link (example):<br><code>https://joomla.local/index.php/component/ajax?plugin=keycloak_oidc&amp;format=raw&amp;task=login</code><br><br>Recommendation: Use the Keycloak frontend login module for site login.<br><br>Backend login is easiest via a custom admin module, e.g.:<br><code>&lt;a class=&quot;btn btn-primary&quot; style=&quot;width:100%;&quot; href=&quot;index.php?option=com_ajax&amp;amp;plugin=keycloak_oidc&amp;amp;format=raw&amp;amp;task=login&amp;amp;lang=en-GB&amp;amp;return=aW5kZXgucGhw&quot;&gt;Login with Keycloak&lt;/a&gt;</code><br><br>Author: ChessLeagueManager project (<a href=\"https://chessleaguemanager.org\" target=\"_blank\" rel=\"noopener\">chessleaguemanager.org</a>)."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ISSUER_LABEL="Issuer"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ISSUER_DESC="OIDC Issuer URL. Examples: https://keycloak.example/realms/myrealm, https://authentik.example/application/o/myapp/, https://login.example.auth0.com/"

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ENDPOINT_MODE_LABEL="Endpoint mode"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ENDPOINT_MODE_DESC="How OIDC endpoints are resolved. Discovery loads the OpenID configuration from issuer/.well-known/openid-configuration. Static mode allows defining endpoints manually (useful behind reverse proxies / port mappings)."
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ENDPOINT_MODE_OPTION_DISCOVERY="Discovery (recommended)"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ENDPOINT_MODE_OPTION_STATIC="Static endpoints"

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_STATIC_NOTICE_LABEL="Static endpoints security"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_STATIC_NOTICE_DESC="In static mode you must ensure all endpoints match the issuer origin (scheme/host/port). Allowing different hosts is dangerous and should only be used with a strict allowlist."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_AUTHORIZATION_ENDPOINT_LABEL="Authorization endpoint"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_AUTHORIZATION_ENDPOINT_DESC="Full authorization endpoint URL (authorization_endpoint). Copy from your provider's OIDC Discovery document."
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_TOKEN_ENDPOINT_LABEL="Token endpoint"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_TOKEN_ENDPOINT_DESC="Full token endpoint URL (token_endpoint). Copy from your provider's OIDC Discovery document."
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JWKS_URI_LABEL="JWKS URI"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JWKS_URI_DESC="Full JWKS URI (jwks_uri). Copy from your provider's OIDC Discovery document."
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_USERINFO_ENDPOINT_LABEL="Userinfo endpoint (optional)"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_USERINFO_ENDPOINT_DESC="Optional userinfo endpoint URL (userinfo_endpoint)."
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_END_SESSION_ENDPOINT_LABEL="End session endpoint (optional)"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_END_SESSION_ENDPOINT_DESC="Optional end session / logout endpoint URL (end_session_endpoint)."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_STATIC_ALLOW_DIFFERENT_HOST_LABEL="Allow different endpoint host *"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_STATIC_ALLOW_DIFFERENT_HOST_DESC="If enabled, endpoints may use a different host/port than the issuer. This is dangerous (endpoint mix-up risk) and requires an explicit allowlist."
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_STATIC_ALLOWED_HOSTS_LABEL="Allowed endpoint hosts"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_STATIC_ALLOWED_HOSTS_DESC="Comma-separated allowlist of hosts/host:port that may be used by endpoints in static mode when different host is allowed. Example: keycloak.example, keycloak.example:6364"

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ALLOW_DIFFERENT_ENDPOINT_HOST_LABEL="Allow different endpoint host *"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ALLOW_DIFFERENT_ENDPOINT_HOST_DESC="If enabled, endpoints may use a different host/port than the issuer. This is dangerous (endpoint mix-up risk) and requires an explicit allowlist."
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ALLOWED_ENDPOINT_HOSTS_LABEL="Allowed endpoint hosts"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ALLOWED_ENDPOINT_HOSTS_DESC="Comma-separated allowlist of hosts/host:port that may be used by endpoints when different host is allowed. Example: keycloak.example, keycloak.example:6364"

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_TLS_CA_BUNDLE_PATH_LABEL="TLS CA bundle path"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_TLS_CA_BUNDLE_PATH_DESC="Optional filesystem path to a CA bundle file used to validate the OIDC provider's TLS certificate (e.g. /etc/ssl/certs/ca-certificates.crt). Leave empty to use system defaults."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_TLS_VERIFY_LABEL="TLS Verification"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_TLS_VERIFY_DESC="Controls TLS certificate verification for OIDC provider HTTP requests. Disabling verification is NOT recommended and should only be used temporarily for testing."

PLG_SYSTEM_KEYCLOAK_OIDC_SECURITY_NOTICE_LABEL="Security notice"
PLG_SYSTEM_KEYCLOAK_OIDC_SECURITY_NOTICE_OIDC_DESC="WARNING: Disabling TLS verification is insecure (MITM risk). Prefer fixing the certificate chain or using a proper CA bundle path."
PLG_SYSTEM_KEYCLOAK_OIDC_SECURITY_NOTICE_JIT_DESC="WARNING: Options marked with * reduce security and should be enabled only if you understand the impact."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_KEYCLOAK_INTERNAL_BASE_LABEL="Keycloak internal base URL"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_KEYCLOAK_INTERNAL_BASE_DESC="Optional internal Keycloak base URL for server-to-server requests (e.g. http://keycloak:8080). Leave empty to use the issuer host directly."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_KEYCLOAK_INTERNAL_BASE_NOTICE_LABEL="Internal base URL notice"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_KEYCLOAK_INTERNAL_BASE_NOTICE_DESC="If you set an internal base URL, it will be used for server-to-server requests once the internal host is allowlisted in allowed_endpoint_hosts (or static_allowed_hosts). If the allowlist is empty, the internal host will be implicitly allowed. Misconfiguration can cause TLS/SNI host mismatch and SSL errors (curl_errno=60)."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_CLIENT_ID_LABEL="Client ID"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_CLIENT_ID_DESC="OIDC client_id as configured in your OIDC provider."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_CLIENT_SECRET_LABEL="Client Secret"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_CLIENT_SECRET_DESC="OIDC client_secret as configured in your OIDC provider. Do not paste this anywhere else."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_SCOPES_LABEL="Scopes"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_SCOPES_DESC="Space-separated list of scopes. Default: openid profile email"

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ENABLE_FRONTEND_LABEL="Enable frontend"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ENABLE_FRONTEND_DESC="Enable OIDC authentication flow for the site (frontend)."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ENABLE_BACKEND_LABEL="Enable backend"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ENABLE_BACKEND_DESC="Enable OIDC authentication flow for administrator (backend)."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ALLOW_LOCAL_ADMIN_LOGIN_LABEL="Allow local admin login (break-glass)"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ALLOW_LOCAL_ADMIN_LOGIN_DESC="If enabled, you can bypass OIDC enforcement in /administrator by adding kc_local=1 to the login URL. This is intended as a safe fallback to prevent lockouts."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_CLIENT_AUTH_IN_HEADER_LABEL="Client auth in header"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_CLIENT_AUTH_IN_HEADER_DESC="Send client credentials to the token endpoint using HTTP Basic Authorization header. Recommended."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_CLIENT_AUTH_IN_BODY_LABEL="Client auth in body"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_CLIENT_AUTH_IN_BODY_DESC="Send client credentials to the token endpoint in the POST body. Prefer header unless your OIDC provider requires otherwise."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JOOMLA_PUBLIC_BASE_SITE_LABEL="Joomla public base (site)"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JOOMLA_PUBLIC_BASE_SITE_DESC="Optional public base URL used when generating redirect_uri for frontend login. Useful behind proxies or non-standard ports. Example: https://joomla.example.org:8443/"

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JOOMLA_PUBLIC_BASE_ADMIN_LABEL="Joomla public base (administrator)"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JOOMLA_PUBLIC_BASE_ADMIN_DESC="Optional public base URL used when generating redirect_uri for backend login. Example: https://joomla.example.org:8443/administrator/"

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JIT_ALLOWED_EMAIL_DOMAINS_LABEL="Allowed email domains"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JIT_ALLOWED_EMAIL_DOMAINS_DESC="Optional comma-separated allowlist of email domains for JIT and auto-linking. Leave empty to allow any domain. Example: example.org,example.com"

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JIT_GROUP_IDS_LABEL="JIT group IDs"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JIT_GROUP_IDS_DESC="Comma-separated Joomla user group IDs assigned to newly created users. Default: 2 (Registered). Privileged groups (Administrator/Super Users) are blocked unless explicitly allowed."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JIT_ALLOW_PRIVILEGED_LABEL="Allow privileged groups *"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_JIT_ALLOW_PRIVILEGED_DESC="If enabled, JIT can create users into privileged groups (Administrator/Super Users). Strongly discouraged."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ALLOW_EMAIL_LINKING_LABEL="Allow email linking"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ALLOW_EMAIL_LINKING_DESC="If enabled and email_verified=true, users without a mapping may be linked to an existing Joomla account by matching email, creating a new issuer+sub mapping."

PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ALLOW_JIT_CREATE_LABEL="Allow JIT user creation"
PLG_SYSTEM_KEYCLOAK_OIDC_FIELD_ALLOW_JIT_CREATE_DESC="If enabled and email_verified=true, users without a mapping and without an existing email match may be created and then mapped."
